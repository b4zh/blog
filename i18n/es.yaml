# --- the office sheet -------------------------------------------------------
# The landing page's views. A drawing set indexes its sheets by number; the
# home sheet indexes its views the same way. These are the view names — a site
# that wants different words overrides these ids in its own i18n/ directory,
# which is how every other label in the theme is changed.

